name: Documentation

on:
  workflow_dispatch:
  push:
    branches:
      - master

env:
  CI_GRADLE_ARG_PROPERTIES: "--stacktrace"

permissions: {}

concurrency:
  group: ${{ format('docs-{0}', github.ref)  }}
  cancel-in-progress: true

jobs:
  dokka-api:
    name: Dokka API
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false
      - name: Configure JDK
        uses: actions/setup-java@be666c2fcd27ec809703dec50e508c2fdc7f6654 # v5.2.0
        with:
          distribution: 'temurin' # See 'Supported distributions' for available options
          java-version: '21'
      - name: Configure Gradle
        uses: gradle/actions/setup-gradle@0723195856401067f7a2779048b490ace7a47d7c # v5.0.2
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/master' }}
      - name: Build Dokka API
        run: ./gradlew :dokkaGenerate $CI_GRADLE_ARG_PROPERTIES
      - name: Upload Dokka API HTML
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: hanekokoro-framework-dokka-api
          path: |
            build/dokka/html

  docs:
    name: Docs
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false
      - name: Configure Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: 3.x
      - name: Install Zensical
        run: pip install zensical
      - name: Build
        run: zensical build --clean
      - name: Upload Docs HTML
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: hanekokoro-framework-docs
          path: |
            site

  deploy:
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    needs: [ docs, dokka-api ]
    runs-on: ubuntu-latest
    steps:
      - name: Download Docs Artifact
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: hanekokoro-framework-docs
          path: site
      - name: Download Dokka API Artifact
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: hanekokoro-framework-dokka-api
          path: site/api
      - name: Upload GitHub Pages Content
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: site
      - name: Deploy GitHub Pages Content
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5.0.0
        id: deployment
